<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agent AI | Autonomous Multi-Agent Security Engine</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- React 18, ReactDOM 18, and Babel -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace']
                    },
                    colors: {
                        dark: {
                            950: '#060910',
                            900: '#0a0f1c',
                            850: '#101827',
                            800: '#172035',
                            750: '#1e2a44',
                            700: '#283755',
                            600: '#35486c'
                        },
                        cyber: {
                            cyan: '#22d3ee',
                            emerald: '#10b981',
                            purple: '#a78bfa',
                            amber: '#f59e0b',
                            rose: '#fb7185'
                        }
                    },
                    boxShadow: {
                        'glow-cyan': '0 0 0 1px rgba(34,211,238,0.25), 0 8px 30px -8px rgba(34,211,238,0.35)',
                        'soft': '0 10px 40px -12px rgba(0,0,0,0.55)'
                    }
                }
            }
        }
    </script>

    <style>
        :root {
            --accent-from: #22d3ee;
            --accent-to: #a78bfa;
        }
        html { scroll-behavior: smooth; }
        body {
            background-color: #060910;
            color: #e7edf6;
            background-image:
                radial-gradient(900px circle at 12% -5%, rgba(34,211,238,0.10), transparent 45%),
                radial-gradient(1000px circle at 100% 0%, rgba(167,139,250,0.10), transparent 42%),
                radial-gradient(800px circle at 50% 120%, rgba(16,185,129,0.06), transparent 50%);
            background-attachment: fixed;
        }
        /* Faint grid texture overlay */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            background-image:
                linear-gradient(rgba(148,163,184,0.035) 1px, transparent 1px),
                linear-gradient(90deg, rgba(148,163,184,0.035) 1px, transparent 1px);
            background-size: 44px 44px;
            mask-image: radial-gradient(ellipse 80% 60% at 50% 0%, #000 40%, transparent 100%);
        }
        #root { position: relative; z-index: 1; }

        /* Custom scrollbar */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, #283755, #1e2a44);
            border-radius: 8px;
            border: 2px solid transparent;
            background-clip: padding-box;
        }
        ::-webkit-scrollbar-thumb:hover { background: #35486c; }

        /* Elegant surface treatments */
        .glass {
            background: linear-gradient(160deg, rgba(23,32,53,0.72), rgba(10,15,28,0.72));
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(148,163,184,0.10);
        }
        .glass-soft {
            background: rgba(16,24,39,0.55);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(148,163,184,0.08);
        }
        .card-hover {
            transition: transform .25s cubic-bezier(.4,0,.2,1), border-color .25s, box-shadow .25s;
        }
        .card-hover:hover {
            transform: translateY(-3px);
            border-color: rgba(34,211,238,0.35);
            box-shadow: 0 18px 50px -18px rgba(34,211,238,0.28);
        }
        .accent-text {
            background: linear-gradient(92deg, var(--accent-from), var(--accent-to));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .accent-bar {
            background: linear-gradient(92deg, var(--accent-from), var(--accent-to));
        }
        .btn-accent {
            background: linear-gradient(92deg, var(--accent-from), var(--accent-to));
            color: #05080f;
            transition: filter .2s, transform .1s, box-shadow .25s;
            box-shadow: 0 10px 30px -10px rgba(34,211,238,0.5);
        }
        .btn-accent:hover { filter: brightness(1.08); box-shadow: 0 14px 38px -10px rgba(34,211,238,0.6); }
        .btn-accent:active { transform: scale(.97); }

        /* Scroll-spy nav pill */
        .nav-pill { position: relative; transition: color .2s; }
        .nav-pill.active { color: #fff; }
        .nav-pill.active::after {
            content: "";
            position: absolute;
            left: 10px; right: 10px; bottom: -1px;
            height: 2px;
            border-radius: 2px;
            background: linear-gradient(92deg, var(--accent-from), var(--accent-to));
            box-shadow: 0 0 10px rgba(34,211,238,0.6);
        }

        /* Section reveal / scroll-margin for sticky nav offset */
        section[id] { scroll-margin-top: 150px; }

        /* Hide scrollbar on the horizontal section nav */
        .no-scrollbar { scrollbar-width: none; -ms-overflow-style: none; }
        .no-scrollbar::-webkit-scrollbar { display: none; }

        @keyframes pulse-glow {
            0%, 100% { opacity: 1; filter: drop-shadow(0 0 10px rgba(34,211,238,0.6)); }
            50% { opacity: 0.7; filter: drop-shadow(0 0 3px rgba(34,211,238,0.2)); }
        }
        .animate-pulse-glow { animation: pulse-glow 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }

        @keyframes fade-in-up {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in { animation: fade-in-up .4s ease both; }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }
        .animate-float { animation: float 4s ease-in-out infinite; }

        @keyframes sheen {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }
        .skeleton {
            background: linear-gradient(90deg, rgba(148,163,184,0.06) 25%, rgba(148,163,184,0.16) 37%, rgba(148,163,184,0.06) 63%);
            background-size: 200% 100%;
            animation: sheen 1.4s linear infinite;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col font-sans antialiased text-slate-100 selection:bg-cyan-400 selection:text-black">

    <div id="root">
        <!-- Initial Loader before React Mounts -->
        <div class="min-h-screen flex items-center justify-center text-slate-400">
            <div class="text-center space-y-4">
                <div class="inline-flex items-center justify-center h-16 w-16 rounded-2xl glass text-cyan-300 text-3xl animate-float shadow-glow-cyan">
                    <i class="fa-solid fa-shield-halved animate-pulse-glow"></i>
                </div>
                <div class="text-base font-bold text-white tracking-wide">Initializing Agent AI</div>
                <div class="text-xs text-slate-500 font-mono">Loading autonomous multi-agent telemetry…</div>
            </div>
        </div>
    </div>

    <!-- React Application Code -->
    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        // --- Helper Formatting Functions ---
        function formatStopwatch(ms) {
            if (ms < 0 || isNaN(ms)) ms = 0;
            const totalSec = Math.floor(ms / 1000);
            const minutes = Math.floor(totalSec / 60);
            const seconds = totalSec % 60;
            const tenths = Math.floor((ms % 1000) / 100);

            const mm = String(minutes).padStart(2, '0');
            const ss = String(seconds).padStart(2, '0');
            return `${mm}:${ss}.${tenths}`;
        }

        function formatDurationHuman(ms) {
            if (ms < 0 || isNaN(ms)) ms = 0;
            const totalSec = Math.round(ms / 1000);
            const m = Math.floor(totalSec / 60);
            const s = totalSec % 60;
            if (m === 0) return `${s}s`;
            return `${m}m ${s}s`;
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        // --- Main App Component ---
        function App() {
            // Data States
            const [session, setSession] = useState({
                is_active: false,
                started_at: null,
                completed_at: null,
                target: null,
                active_tasks_count: 0,
                total_tasks_count: 0
            });
            const [assets, setAssets] = useState([]);
            const [vulnerabilities, setVulnerabilities] = useState([]);
            const [attackPaths, setAttackPaths] = useState([]);
            const [queueTasks, setQueueTasks] = useState([]);

            // Stopwatch & Elapsed Time
            const [elapsedMs, setElapsedMs] = useState(0);

            // Controls & Filter States
            const [filter, setFilter] = useState('all');
            const [searchQuery, setSearchQuery] = useState('');
            const [autoRefresh, setAutoRefresh] = useState(true);
            const [countdown, setCountdown] = useState(3);
            const [isRefreshing, setIsRefreshing] = useState(false);
            const [activeTab, setActiveTab] = useState('overview'); // scroll-spy section id

            // Target Form State
            const [targetDomain, setTargetDomain] = useState('');
            const [targetLayer, setTargetLayer] = useState('Web');
            const [isAuthorized, setIsAuthorized] = useState(true);
            const [includeCrownJewel, setIncludeCrownJewel] = useState(true);
            const [isSubmittingTarget, setIsSubmittingTarget] = useState(false);

            // Remediation Modal State
            const [modalVulnId, setModalVulnId] = useState(null);
            const [remediationPlan, setRemediationPlan] = useState(null);
            const [remediationLoading, setRemediationLoading] = useState(false);
            const [remediationError, setRemediationError] = useState(null);
            const [copySuccess, setCopySuccess] = useState(false);

            // Retest & Reset States
            const [retestingVulnId, setRetestingVulnId] = useState(null);
            const [isResetting, setIsResetting] = useState(false);
            const [toastMessage, setToastMessage] = useState(null);

            const toastTimeoutRef = useRef(null);
            const showToast = (msg) => {
                if (toastTimeoutRef.current) clearTimeout(toastTimeoutRef.current);
                setToastMessage(msg);
                toastTimeoutRef.current = setTimeout(() => setToastMessage(null), 3500);
            };

            // --- Real-time Stopwatch Interval (Runs every 100ms) ---
            useEffect(() => {
                const timer = setInterval(() => {
                    if (session.is_active && session.started_at) {
                        const start = new Date(session.started_at).getTime();
                        const now = Date.now();
                        setElapsedMs(Math.max(0, now - start));
                    } else if (session.completed_at && session.started_at) {
                        const start = new Date(session.started_at).getTime();
                        const end = new Date(session.completed_at).getTime();
                        setElapsedMs(Math.max(0, end - start));
                    } else {
                        setElapsedMs(0);
                    }
                }, 100);
                return () => clearInterval(timer);
            }, [session.is_active, session.started_at, session.completed_at]);

            // --- Data Fetching Logic ---
            const fetchData = async (silent = false) => {
                if (!silent) setIsRefreshing(true);
                try {
                    const [sessRes, assetsRes, vulnsRes, pathsRes, tasksRes] = await Promise.all([
                        fetch('/api/v1/session'),
                        fetch('/api/v1/assets'),
                        fetch('/api/v1/vulnerabilities'),
                        fetch('/api/v1/attack-paths'),
                        fetch('/api/v1/queue')
                    ]);

                    if (sessRes.ok) {
                        const sessData = await sessRes.json();
                        setSession(sessData);
                    }
                    if (assetsRes.ok) setAssets(await assetsRes.json());
                    if (vulnsRes.ok) setVulnerabilities(await vulnsRes.json());
                    if (pathsRes.ok) setAttackPaths(await pathsRes.json());
                    if (tasksRes.ok) setQueueTasks(await tasksRes.json());
                } catch (err) {
                    console.error("Failed to fetch dashboard data:", err);
                } finally {
                    if (!silent) {
                        setTimeout(() => setIsRefreshing(false), 300);
                    }
                }
            };

            // Initial Fetch on Mount
            useEffect(() => {
                fetchData(false);
            }, []);

            // Auto-Refresh Polling Loop (Countdown 3s)
            useEffect(() => {
                const interval = setInterval(() => {
                    if (!autoRefresh) return;
                    setCountdown(prev => {
                        if (prev <= 1) {
                            fetchData(true);
                            return 3;
                        }
                        return prev - 1;
                    });
                }, 1000);
                return () => clearInterval(interval);
            }, [autoRefresh]);

            // --- Scroll-spy: highlight the nav section currently in view ---
            const sectionIds = ['overview', 'swarm', 'chains', 'findings'];
            useEffect(() => {
                const observer = new IntersectionObserver((entries) => {
                    const visible = entries
                        .filter(e => e.isIntersecting)
                        .sort((a, b) => b.intersectionRatio - a.intersectionRatio);
                    if (visible.length > 0) {
                        setActiveTab(visible[0].target.id);
                    }
                }, { rootMargin: '-45% 0px -45% 0px', threshold: [0, 0.25, 0.5, 1] });

                sectionIds.forEach(id => {
                    const el = document.getElementById(id);
                    if (el) observer.observe(el);
                });
                return () => observer.disconnect();
            }, []);

            const scrollToSection = (id) => {
                const el = document.getElementById(id);
                if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
            };

            // --- Target Submission ---
            const handleTargetSubmit = async (e) => {
                e.preventDefault();
                const trimmedDomain = targetDomain.trim();
                if (!trimmedDomain) return;

                setIsSubmittingTarget(true);
                try {
                    const res = await fetch('/api/v1/targets', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            domain_or_ip: trimmedDomain,
                            layer: targetLayer,
                            is_authorized: isAuthorized,
                            include_simulated_crown_jewel: includeCrownJewel
                        })
                    });

                    if (!res.ok) {
                        const err = await res.json();
                        throw new Error(err.detail || 'Target launch failed.');
                    }

                    showToast(`Autonomous assessment launched for ${trimmedDomain}!`);
                    setTargetDomain('');
                    fetchData(false);
                } catch (err) {
                    alert("Submission failed: " + err.message);
                } finally {
                    setIsSubmittingTarget(false);
                }
            };

            // --- Reset Session to Standby ---
            const handleResetSession = async () => {
                if (!window.confirm("Are you sure you want to reset the engine to Standby? This will clear all discovered assets, tasks, and findings.")) {
                    return;
                }
                setIsResetting(true);
                try {
                    const res = await fetch('/api/v1/reset', { method: 'POST' });
                    if (res.ok) {
                        showToast("Engine returned to Standby mode. All metrics cleared.");
                        fetchData(false);
                    }
                } catch (err) {
                    alert("Failed to reset: " + err.message);
                } finally {
                    setIsResetting(false);
                }
            };

            // --- Remediation Modal Logic ---
            const openRemediation = async (vulnId) => {
                setModalVulnId(vulnId);
                setRemediationPlan(null);
                setRemediationError(null);
                setRemediationLoading(true);
                setCopySuccess(false);

                try {
                    const res = await fetch(`/api/v1/remediations/${vulnId}`);
                    if (!res.ok) {
                        setRemediationError("Remediation patch is currently being synthesized by Gemini 3.5 Flash-Lite. Please check back in a few seconds.");
                        return;
                    }
                    const data = await res.json();
                    setRemediationPlan(data);
                } catch (err) {
                    setRemediationError("Error loading remediation: " + err.message);
                } finally {
                    setRemediationLoading(false);
                }
            };

            const closeRemediation = () => {
                setModalVulnId(null);
                setRemediationPlan(null);
            };

            const copyPatchCode = () => {
                if (!remediationPlan?.patched_code_snippet) return;
                navigator.clipboard.writeText(remediationPlan.patched_code_snippet).then(() => {
                    setCopySuccess(true);
                    setTimeout(() => setCopySuccess(false), 2500);
                });
            };

            // --- Trigger Retesting ---
            const handleTriggerRetest = async (vulnId) => {
                setRetestingVulnId(vulnId);
                try {
                    const res = await fetch(`/api/v1/retest/${vulnId}`, { method: 'POST' });
                    const data = await res.json();
                    showToast(data.message || "Retest dispatched to orchestrator!");
                    fetchData(true);
                } catch (err) {
                    alert("Retest failed: " + err.message);
                } finally {
                    setRetestingVulnId(null);
                }
            };

            // Filtered Findings
            const filteredVulns = useMemo(() => {
                return vulnerabilities.filter(v => {
                    const matchesFilter = filter === 'all' || v.status === filter;
                    const matchesSearch = !searchQuery ||
                        v.title.toLowerCase().includes(searchQuery.toLowerCase()) ||
                        v.discovery_source.toLowerCase().includes(searchQuery.toLowerCase()) ||
                        v.id.toLowerCase().includes(searchQuery.toLowerCase());
                    return matchesFilter && matchesSearch;
                });
            }, [vulnerabilities, filter, searchQuery]);

            // Filter Counts
            const filterCounts = useMemo(() => {
                return {
                    all: vulnerabilities.length,
                    validated: vulnerabilities.filter(v => v.status === 'validated').length,
                    remediated: vulnerabilities.filter(v => v.status === 'remediated').length,
                    unvalidated: vulnerabilities.filter(v => v.status === 'unvalidated').length,
                    false_positive: vulnerabilities.filter(v => v.status === 'false_positive').length
                };
            }, [vulnerabilities]);

            // Severity Breakdown
            const severityStats = useMemo(() => {
                let crit = 0, high = 0, med = 0, low = 0;
                vulnerabilities.forEach(v => {
                    if (v.criticality_score >= 9.0) crit++;
                    else if (v.criticality_score >= 7.0) high++;
                    else if (v.criticality_score >= 4.0) med++;
                    else low++;
                });
                return { crit, high, med, low };
            }, [vulnerabilities]);

            // Crown Jewels count
            const crownJewelsCount = useMemo(() => {
                return assets.filter(a => a.metadata && a.metadata.is_crown_jewel).length;
            }, [assets]);

            // Operational 10-Minute Progress Bar
            const tenMinMs = 10 * 60 * 1000; // 600,000 ms
            const operationalProgressPct = Math.min(100, Math.max(0, (elapsedMs / tenMinMs) * 100));

            // Selected Vuln for Modal
            const selectedVuln = useMemo(() => {
                return vulnerabilities.find(v => v.id === modalVulnId) || null;
            }, [vulnerabilities, modalVulnId]);

            // Active Agents from Queue
            const activeAgentsSet = useMemo(() => {
                const set = new Set();
                queueTasks.forEach(t => {
                    if (t.status === 'in_progress') {
                        set.add(t.target_agent.replace('_agent', ''));
                    }
                });
                return set;
            }, [queueTasks]);

            // Navigation items for the sticky sub-nav
            const navItems = [
                { id: 'overview', label: 'Launchpad', icon: 'fa-bullseye' },
                { id: 'swarm', label: 'Agent Swarm', icon: 'fa-users-gear' },
                { id: 'chains', label: 'Attack Chains', icon: 'fa-arrows-split-up-and-left' },
                { id: 'findings', label: 'Findings', icon: 'fa-shield-virus' }
            ];

            return (
                <div className="min-h-screen flex flex-col">

                    {/* Toast Notification */}
                    {toastMessage && (
                        <div className="fixed bottom-6 right-6 z-[60] glass border border-cyan-500/40 text-cyan-200 px-5 py-3.5 rounded-2xl shadow-soft flex items-center gap-3 animate-fade-in">
                            <i className="fa-solid fa-circle-check text-emerald-400 text-lg"></i>
                            <span className="text-xs font-semibold text-white">{toastMessage}</span>
                        </div>
                    )}

                    {/* --- 1. Top Global Navigation Header --- */}
                    <header className="glass border-b border-white/5 sticky top-0 z-40 px-4 sm:px-8 py-3 shadow-soft">
                        <div className="max-w-7xl mx-auto flex flex-col lg:flex-row items-center justify-between gap-3">

                            {/* Brand & Identity */}
                            <div className="flex items-center justify-between w-full lg:w-auto">
                                <div className="flex items-center space-x-3">
                                    <div className="h-11 w-11 rounded-2xl accent-bar flex items-center justify-center text-slate-950 font-bold text-xl shadow-glow-cyan">
                                        <i className="fa-solid fa-shield-halved"></i>
                                    </div>
                                    <div>
                                        <div className="flex items-center space-x-2">
                                            <h1 className="font-extrabold text-lg tracking-tight text-white">Agent<span className="accent-text">AI</span></h1>
                                            <span className="text-[10px] font-bold px-2 py-0.5 rounded-full bg-cyan-500/10 text-cyan-300 border border-cyan-500/25 tracking-wider">
                                                AUTONOMOUS ENGINE
                                            </span>
                                        </div>
                                        <p className="text-[11px] text-slate-400">Continuous Multi-Agent Vulnerability Assessment &amp; Patching</p>
                                    </div>
                                </div>

                                {/* Mobile Status Indicator */}
                                <div className="lg:hidden flex items-center gap-2">
                                    <span className={`h-2.5 w-2.5 rounded-full ${session.is_active ? 'bg-cyan-400 animate-ping' : (assets.length ? 'bg-emerald-400' : 'bg-slate-500')}`}></span>
                                    <span className="text-xs font-mono font-bold text-slate-300">{formatStopwatch(elapsedMs)}</span>
                                </div>
                            </div>

                            {/* Center: Precision Scan Stopwatch Widget */}
                            <div className="flex items-center gap-3 glass-soft px-4 py-2 rounded-2xl">
                                <div className="flex items-center gap-2">
                                    <i className={`fa-solid fa-stopwatch text-base ${session.is_active ? 'text-cyan-400 animate-pulse' : (session.completed_at ? 'text-emerald-400' : 'text-slate-500')}`}></i>
                                    <div className="text-left">
                                        <div className="text-[10px] uppercase tracking-wider font-semibold text-slate-400 flex items-center gap-1">
                                            <span>Scan Stopwatch</span>
                                            {session.is_active && (
                                                <span className="h-1.5 w-1.5 rounded-full bg-cyan-400 animate-ping inline-block"></span>
                                            )}
                                        </div>
                                        <div className="text-base font-black font-mono tracking-wider text-white">
                                            {formatStopwatch(elapsedMs)}
                                        </div>
                                    </div>
                                </div>

                                <div className="h-7 w-[1px] bg-white/10 mx-1"></div>

                                {/* Status Tag */}
                                <div>
                                    {session.is_active ? (
                                        <div className="text-left">
                                            <span className="px-2 py-0.5 rounded-md text-[10px] font-extrabold bg-cyan-500/20 text-cyan-300 border border-cyan-500/40 inline-flex items-center gap-1">
                                                <i className="fa-solid fa-bolt text-[9px] animate-bounce"></i> ACTIVE SCAN
                                            </span>
                                            <span className="block text-[10px] text-slate-400 font-mono mt-0.5">
                                                {session.active_tasks_count} tasks in flight
                                            </span>
                                        </div>
                                    ) : session.completed_at ? (
                                        <div className="text-left">
                                            <span className="px-2 py-0.5 rounded-md text-[10px] font-extrabold bg-emerald-500/20 text-emerald-300 border border-emerald-500/40 inline-flex items-center gap-1">
                                                <i className="fa-solid fa-check text-[9px]"></i> COMPLETE
                                            </span>

                                                            ))}
                                                        </div>
                                                    </div>
                                                )}

                                                {/* 6. Strategic Chokepoint Action Banner */}
                                                <div className="bg-dark-950/60 border border-amber-500/30 rounded-2xl p-4 text-xs flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                                                    <div className="flex items-start gap-3">
                                                        <div className="h-9 w-9 rounded-xl bg-amber-500/20 text-amber-400 border border-amber-500/40 flex items-center justify-center text-base flex-shrink-0 mt-0.5">
                                                            <i className="fa-solid fa-crosshairs"></i>
                                                        </div>
                                                        <div>
                                                            <div className="flex items-center gap-2 flex-wrap mb-0.5">
                                                                <span className="font-bold text-amber-300 text-sm">
                                                                    Primary Strategic Chokepoint:
                                                                </span>
                                                                <span className="text-white font-bold text-xs bg-white/5 px-2 py-0.5 rounded border border-white/10">
                                                                    {chokepointTitle}
                                                                </span>
                                                            </div>
                                                            <span className="text-[11px] text-slate-400 block leading-relaxed">
                                                                Remediating this critical chokepoint eliminates the attacker's ingress capability and severs the causal progression to the Crown Jewel DB.
                                                            </span>
                                                        </div>
                                                    </div>
                                                    <button
                                                        onClick={() => openRemediation(path.chokepoint_vuln_id)}
                                                        className="px-4 py-2 bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-400 hover:to-amber-500 text-dark-950 font-black rounded-xl transition text-xs whitespace-nowrap active:scale-95 shadow-lg flex items-center justify-center gap-1.5">
                                                        <i className="fa-solid fa-wrench"></i>
                                                        Apply Chokepoint Patch
                                                    </button>
                                                </div>

                                            </div>
                                        );
                                    })}
                                </div>
                            )}
                        </section>

                        {/* --- 6. Vulnerability Posture & Findings Studio --- */}
                        <section id="findings" className="glass rounded-3xl p-5 sm:p-7 shadow-soft">
                            <div className="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-6">
                                <div>
                                    <h3 className="text-lg sm:text-xl font-bold text-white flex items-center gap-2">
                                        <i className="fa-solid fa-shield-virus text-rose-400"></i>
                                        Vulnerability Findings &amp; Automated Fixes
                                    </h3>
                                    <p className="text-xs sm:text-sm text-slate-400 mt-1">
                                        Real-time findings, sandbox proof-of-concept verification, and AI-synthesized developer patches.
                                    </p>
                                </div>

                                {/* Search Input */}
                                <div className="w-full md:w-64">
                                    <div className="relative">
                                        <span className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-500 text-xs">
                                            <i className="fa-solid fa-magnifying-glass"></i>
                                        </span>
                                        <input
                                            type="text"
                                            placeholder="Search CVE, title, or asset..."
                                            value={searchQuery}
                                            onChange={(e) => setSearchQuery(e.target.value)}
                                            className="w-full bg-dark-950/70 border border-white/10 rounded-xl pl-8 pr-3 py-1.5 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-cyan-400 focus:ring-2 focus:ring-cyan-500/30 transition"
                                        />
                                    </div>
                                </div>
                            </div>

                            {/* Filter Tabs */}
                            <div className="flex items-center gap-1.5 flex-wrap glass-soft p-1.5 rounded-2xl text-xs mb-5">
                                {[
                                    { id: 'all', label: 'All Findings', count: filterCounts.all },
                                    { id: 'validated', label: 'Validated Exploitable', count: filterCounts.validated },
                                    { id: 'remediated', label: 'Remediated', count: filterCounts.remediated },
                                    { id: 'unvalidated', label: 'Unvalidated', count: filterCounts.unvalidated },
                                    { id: 'false_positive', label: 'False Positives', count: filterCounts.false_positive }
                                ].map(tab => (
                                    <button
                                        key={tab.id}
                                        onClick={() => setFilter(tab.id)}
                                        className={`px-3 py-1.5 rounded-xl font-bold transition flex items-center gap-1.5 ${
                                            filter === tab.id
                                                ? 'btn-accent'
                                                : 'text-slate-400 hover:text-white hover:bg-white/5'
                                        }`}>
                                        <span>{tab.label}</span>
                                        <span className={`px-1.5 py-0.2 rounded-full text-[10px] ${
                                            filter === tab.id ? 'bg-slate-950/30 text-slate-900' : 'bg-white/5 text-slate-400'
                                        }`}>
                                            {tab.count}
                                        </span>
                                    </button>
                                ))}
                            </div>

                            {/* Findings Cards Grid */}
                            {filteredVulns.length === 0 ? (
                                <div className="py-16 text-center text-slate-500 bg-dark-950/40 border border-dashed border-white/10 rounded-3xl">
                                    <i className="fa-solid fa-radar fa-spin text-3xl mb-3 text-slate-600 block"></i>
                                    <p className="text-sm font-semibold text-slate-400">No vulnerabilities matching current criteria.</p>
                                    <p className="text-xs text-slate-500 mt-1">
                                        {vulnerabilities.length === 0 ? 'Submit a target domain or IP above to begin assessment.' : 'Try adjusting the filter or search query.'}
                                    </p>
                                </div>
                            ) : (
                                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                                    {filteredVulns.map(vuln => {
                                        const asset = assets.find(a => a.id === vuln.asset_id);
                                        const assetName = asset ? asset.asset_identifier : vuln.asset_id;

                                        // CVSS score badge
                                        let cvssColor = 'bg-slate-800 text-slate-300 border-slate-700';
                                        if (vuln.criticality_score >= 9.0) cvssColor = 'bg-rose-500/20 text-rose-300 border-rose-500/40';
                                        else if (vuln.criticality_score >= 7.0) cvssColor = 'bg-amber-500/20 text-amber-300 border-amber-500/40';
                                        else if (vuln.criticality_score >= 4.0) cvssColor = 'bg-cyan-500/20 text-cyan-300 border-cyan-500/40';

                                        // Status badge
                                        let statusColor = 'bg-white/5 text-slate-400 border-white/10';
                                        if (vuln.status === 'validated') statusColor = 'bg-emerald-950/60 text-emerald-300 border-emerald-500/40';
                                        if (vuln.status === 'remediated') statusColor = 'bg-blue-950/60 text-blue-300 border-blue-500/40';
                                        if (vuln.status === 'false_positive') statusColor = 'bg-white/5 text-slate-500 border-white/10';

                                        return (
                                            <div
                                                key={vuln.id}
                                                className="glass-soft card-hover rounded-2xl p-5 flex flex-col justify-between group">
                                                <div>
                                                    {/* Badges Row */}
                                                    <div className="flex items-start justify-between gap-2 mb-3">
                                                        <span className={`px-2.5 py-1 rounded-lg text-xs font-black border ${cvssColor}`}>
                                                            CVSS {vuln.criticality_score.toFixed(1)}
                                                        </span>
                                                        <div className="flex items-center gap-1.5 flex-wrap justify-end">
                                                            {vuln.metadata && vuln.metadata.mitre && vuln.metadata.mitre.technique_id && (
                                                                <span className="px-2 py-0.5 rounded text-[10px] bg-purple-500/20 text-purple-300 border border-purple-500/30 font-mono font-bold" title={vuln.metadata.mitre.technique_name}>
                                                                    {vuln.metadata.mitre.technique_id}
                                                                </span>
                                                            )}
                                                            {vuln.metadata && vuln.metadata.phishing_score && (
                                                                <span className="px-2 py-0.5 rounded text-[10px] bg-amber-500/20 text-amber-300 border border-amber-500/30 font-bold">
                                                                    <i className="fa-solid fa-envelope-open-text mr-1"></i>
                                                                    Phish {vuln.metadata.phishing_score}/100
                                                                </span>
                                                            )}
                                                            {vuln.has_leaked_creds && (
                                                                <span className="px-2 py-0.5 rounded text-[10px] bg-rose-500/20 text-rose-300 border border-rose-500/30 font-bold flex items-center gap-1">
                                                                    <i className="fa-solid fa-key"></i> LEAKED CREDS
                                                                </span>
                                                            )}
                                                            <span className={`px-2 py-0.5 rounded-md text-[10px] uppercase font-bold border ${statusColor}`}>
                                                                {vuln.status}
                                                            </span>
                                                        </div>
                                                    </div>

                                                    {/* Title */}
                                                    <h4 className="text-sm font-bold text-white mb-2 leading-snug group-hover:text-cyan-300 transition">
                                                        {vuln.title}
                                                    </h4>

                                                    {/* Asset and Source */}
                                                    <div className="text-xs text-slate-400 flex items-center gap-2 mb-3 flex-wrap">
                                                        <span className="truncate max-w-[200px]" title={assetName}>
                                                            <i className="fa-solid fa-server text-slate-500 mr-1"></i>
                                                            {assetName}
                                                        </span>
                                                        <span>•</span>
                                                        <span className="text-slate-400 uppercase text-[10px] font-mono whitespace-nowrap bg-white/5 px-2 py-0.5 rounded border border-white/10">
                                                            {vuln.discovery_source ? vuln.discovery_source.replace("TOOL_", "") : "SCANNER"}
                                                        </span>
                                                    </div>

                                                    {/* PoC Snippet Preview */}
                                                    {vuln.proof_of_concept && (
                                                        <div className="mt-2 bg-dark-950/80 border border-white/5 rounded-xl p-3 font-mono text-xs text-slate-300">
                                                            <div className="flex items-center justify-between text-[10px] text-slate-500 mb-1 font-sans">
                                                                <span>BENIGN PROOF-OF-CONCEPT</span>
                                                                <button
                                                                    onClick={() => {
                                                                        navigator.clipboard.writeText(vuln.proof_of_concept);
                                                                        showToast("Proof-of-Concept copied!");
                                                                    }}
                                                                    className="text-cyan-400 hover:text-cyan-300 transition">
                                                                    Copy
                                                                </button>
                                                            </div>
                                                            <code className="text-cyan-300 block select-all break-all line-clamp-2">
                                                                {vuln.proof_of_concept}
                                                            </code>
                                                        </div>
                                                    )}
                                                </div>

                                                {/* Action Bar */}
                                                <div className="pt-4 mt-4 border-t border-white/5 flex items-center justify-between gap-2">
                                                    <span className="text-[11px] text-slate-500 font-mono">
                                                        {vuln.id.substring(0, 8)}
                                                    </span>
                                                    <div className="flex items-center space-x-2">
                                                        <button
                                                            onClick={() => openRemediation(vuln.id)}
                                                            className="px-3 py-1.5 text-xs bg-white/5 hover:bg-white/10 text-cyan-400 rounded-xl border border-cyan-500/30 transition flex items-center gap-1.5 font-semibold active:scale-95">
                                                            <i className="fa-solid fa-wrench text-[10px]"></i>
                                                            <span>AI Patch</span>
                                                        </button>
                                                        <button
                                                            onClick={() => handleTriggerRetest(vuln.id)}
                                                            disabled={retestingVulnId === vuln.id}
                                                            className="px-3 py-1.5 text-xs bg-emerald-500/10 hover:bg-emerald-500/20 text-emerald-300 rounded-xl border border-emerald-500/30 transition flex items-center gap-1.5 font-semibold active:scale-95">
                                                            <i className={`fa-solid fa-vial text-[10px] ${retestingVulnId === vuln.id ? 'fa-spin' : ''}`}></i>
                                                            <span>Retest</span>
                                                        </button>
                                                    </div>
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            )}
                        </section>

                    </main>

                    {/* --- 7. Remediation Studio Modal --- */}
                    {modalVulnId && (
                        <div className="fixed inset-0 bg-black/80 backdrop-blur-md z-50 flex items-center justify-center p-4 animate-fade-in">
                            <div className="glass rounded-3xl max-w-2xl w-full p-6 sm:p-7 shadow-soft relative max-h-[90vh] flex flex-col">

                                {/* Close Button */}
                                <button
                                    onClick={closeRemediation}
                                    className="absolute top-5 right-5 text-slate-400 hover:text-white text-lg transition">
                                    <i className="fa-solid fa-xmark"></i>
                                </button>

                                {/* Modal Header */}
                                <div className="flex items-center space-x-3 mb-4">
                                    <div className="h-10 w-10 rounded-xl bg-emerald-500/10 border border-emerald-500/30 flex items-center justify-center text-emerald-400 text-lg">
                                        <i className="fa-solid fa-code-merge"></i>
                                    </div>
                                    <div>
                                        <h3 className="text-base font-bold text-white">AI Remediation Studio</h3>
                                        <p className="text-xs text-slate-400">
                                            {selectedVuln ? selectedVuln.title : 'Automated Mitigation Patch'}
                                        </p>
                                    </div>
                                </div>

                                {/* Modal Body */}
                                <div className="flex-1 overflow-y-auto space-y-4 pr-1 text-xs">
                                    {remediationLoading ? (
                                        <div className="py-12 text-center text-slate-400 space-y-2">
                                            <i className="fa-solid fa-circle-notch fa-spin text-2xl text-cyan-400"></i>
                                            <p className="text-xs">Querying Gemini 3.5 Flash-Lite for code patch...</p>
                                        </div>
                                    ) : remediationError ? (
                                        <div className="glass-soft rounded-2xl p-4 text-center space-y-2">
                                            <i className="fa-solid fa-clock text-amber-400 text-xl"></i>
                                            <p className="text-slate-300">{remediationError}</p>
                                            <button
                                                onClick={() => openRemediation(modalVulnId)}
                                                className="px-3 py-1 rounded bg-white/5 text-cyan-400 border border-white/10 text-xs">
                                                Retry Fetch
                                            </button>
                                        </div>
                                    ) : remediationPlan ? (
                                        <>
                                            {/* Root Cause Analysis */}
                                            <div className="glass-soft rounded-2xl p-4">
                                                <div className="font-bold text-emerald-400 mb-1.5 flex items-center gap-2">
                                                    <i className="fa-solid fa-stethoscope"></i> Root Cause Analysis
                                                </div>
                                                <p className="text-slate-300 leading-relaxed text-xs">
                                                    {remediationPlan.root_cause_analysis}
                                                </p>
                                            </div>

                                            {/* Tech Stack & Patch Classification */}
                                            <div className="grid grid-cols-2 gap-3 text-xs">
                                                <div className="glass-soft rounded-2xl p-3">
                                                    <span className="text-slate-400 block text-[10px] uppercase font-semibold">Target Tech Stack</span>
                                                    <span className="font-bold text-white text-xs mt-0.5 block font-mono">
                                                        {remediationPlan.target_tech_stack}
                                                    </span>
                                                </div>
                                                <div className="glass-soft rounded-2xl p-3">
                                                    <span className="text-slate-400 block text-[10px] uppercase font-semibold">Patch Type</span>
                                                    <span className="font-bold text-cyan-400 uppercase text-xs mt-0.5 block font-mono">
                                                        {remediationPlan.patch_type}
                                                    </span>
                                                </div>
                                            </div>

                                            {/* Patched Code Snippet */}
                                            <div>
                                                <div className="flex items-center justify-between mb-1.5">
                                                    <span className="font-bold text-slate-200 flex items-center gap-1.5">
                                                        <i className="fa-solid fa-wrench text-amber-400"></i> Synthesized Code Patch
                                                    </span>
                                                    <button
                                                        onClick={copyPatchCode}
                                                        className="text-xs text-cyan-400 hover:text-cyan-300 flex items-center gap-1 font-semibold transition">
                                                        <i className={`fa-regular ${copySuccess ? 'fa-check text-emerald-400' : 'fa-copy'}`}></i>
                                                        <span>{copySuccess ? 'Copied!' : 'Copy Code'}</span>
                                                    </button>
                                                </div>
                                                <pre className="bg-dark-950/90 border border-white/10 rounded-2xl p-4 text-xs text-emerald-400 font-mono overflow-x-auto whitespace-pre-wrap select-all">
                                                    {remediationPlan.patched_code_snippet}
                                                </pre>
                                            </div>

                                            {/* Original Code Context (if available) */}
                                            {remediationPlan.original_code_snippet && remediationPlan.original_code_snippet !== 'N/A' && (
                                                <div>
                                                    <span className="font-bold text-slate-400 block mb-1">Vulnerable Context:</span>
                                                    <pre className="bg-dark-950/90 border border-white/10 rounded-2xl p-3 text-xs text-rose-400 font-mono overflow-x-auto whitespace-pre-wrap">
                                                        {remediationPlan.original_code_snippet}
                                                    </pre>
                                                </div>
                                            )}
                                        </>
                                    ) : null}
                                </div>

                                {/* Modal Footer */}
                                <div className="flex items-center justify-between pt-4 border-t border-white/5 mt-4">
                                    <span className="text-[11px] text-slate-500 font-mono">
                                        Synthesized by Gemini 3.5 Flash-Lite
                                    </span>
                                    <div className="flex items-center space-x-3">
                                        <button
                                            onClick={closeRemediation}
                                            className="px-4 py-2 text-xs text-slate-400 hover:text-white transition">
                                            Close
                                        </button>
                                        <button
                                            onClick={() => {
                                                handleTriggerRetest(modalVulnId);
                                                closeRemediation();
                                            }}
                                            className="px-4 py-2 text-xs font-bold bg-emerald-500 hover:bg-emerald-400 text-slate-950 rounded-xl transition flex items-center gap-2 shadow-lg shadow-emerald-500/20 active:scale-95">
                                            <i className="fa-solid fa-vial-circle-check"></i>
                                            <span>Verify Fix (Retest)</span>
                                        </button>
                                    </div>
                                </div>

                            </div>
                        </div>
                    )}

                    {/* --- Footer --- */}
                    <footer className="border-t border-white/5 py-5 px-4 sm:px-8 text-center text-xs text-slate-500">
                        <div className="max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-2">
                            <div>
                                <span className="font-semibold text-slate-400">Agent<span className="accent-text">AI</span> Autonomous Engine</span> • Built for Next-Gen Continuous Cybersecurity
                            </div>
                            <div className="font-mono text-[11px] text-slate-600">
                                Real-time WebSocket / HTTP REST API
                            </div>
                        </div>
                    </footer>

                </div>
            );
        }

        // Mount React 18 Root
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
